[project]
name = "relevo-ml"
version = "0.1.0"
description = "Pipeline de indexación del corpus normativo de Relevo"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 88
src = [".", "corpus_lib"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["corpus_lib", "extractor", "ordenes"]

[tool.ruff.lint.per-file-ignores]
"tests/html_senado.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../data"]
