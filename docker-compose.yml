services:
  db:
    image: pgvector/pgvector:pg17
    ports:
      - "${PGPORT:-5432}:5432"
    environment:
      POSTGRES_USER: relevo
      POSTGRES_PASSWORD: relevo
      POSTGRES_DB: relevo
    volumes:
      - relevo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relevo -d relevo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
    environment:
      PHOENIX_PORT: "6006"

volumes:
  relevo_pgdata:
